.box{max-width:520px;margin:36px auto 0;padding:28px 22px;display:flex;flex-direction:column;gap:14px}

<body>
<header class="top"><div class="wrap"><a class="logo" href="/"><span class="dot"></span>LudoLab <small>Ebooks</small></a></div></header>
<main class="wrap">
  <section class="box card">
    <h1>¿No te llegó o lo perdiste?</h1>
    <p class="muted">Escribí el mail con el que compraste (o el de tu cuenta de Mercado Pago) y te mandamos de nuevo tu link.</p>
    <form id="f" novalidate>
      <label for="email">Tu mail</label>
      <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="nombre@gmail.com" required>
      <p class="err" id="err" hidden></p>
      <button class="btn block" id="go" type="submit">Mandarme mi ebook</button>
    </form>
    <p class="ok-msg" id="ok" hidden></p>
  </section>
</main>
<footer class="site">
  <div class="wrap">
    <span>© LudoLab Ebooks</span>
    <nav><a href="/recuperar">¿No te llegó?</a><a href="/terminos">Términos</a><a href="/privacidad">Privacidad</a><a href="/contacto">Contacto</a><a href="/contacto#arrepentimiento">Botón de arrepentimiento</a></nav>
  </div>
</footer>
<script>
const f = document.getElementById("f"), email = document.getElementById("email"), err = document.getElementById("err"), ok = document.getElementById("ok"), go = document.getElementById("go");
const q = new URLSearchParams(location.search); if (q.get("email")) email.value = q.get("email");
f.addEventListener("submit", async (e) => {
  e.preventDefault(); err.hidden = true; ok.hidden = true;
  const v = email.value.trim().toLowerCase();
  if (!/^[^\s@|]+@[^\s@|]+\.[a-z]{2,}$/i.test(v)) { err.textContent = "Revisá el mail: parece que le falta algo (ej: nombre@gmail.com)."; err.hidden = false; return; }
  go.disabled = true; go.textContent = "Buscando tu compra…";
  try {
    const r = await fetch("/api/recuperar", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({email: v})});
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || "Probá de nuevo en un momento.");
    ok.textContent = d.msg; ok.hidden = false;
  } catch (e2) { err.textContent = e2.message; err.hidden = false; }
  finally { go.disabled = false; go.textContent = "Mandarme mi ebook"; }
});
</script>
</body>
