<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>¡Gracias! · LudoLab Ebooks</title>
<meta name="theme-color" content="#FAF8F5">
<!-- Meta Pixel -->
<script>
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
document,'script','https://connect.facebook.net/en_US/fbevents.js');
var ud={};try{ud=JSON.parse(localStorage.getItem('ll_lead')||'{}')}catch(e){}
fbq('init', '4240054562902602', ud);   // mail que dejó en la landing (coincidencia avanzada)
fbq('track', 'PageView');
</script>
<noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=4240054562902602&ev=PageView&noscript=1"/></noscript>
<!-- End Meta Pixel -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/assets/site.css">
<style>
.state{max-width:520px;margin:36px auto 0;padding:30px 22px;display:flex;flex-direction:column;gap:16px;text-align:center;align-items:center}
.state h1{font-size:clamp(1.8rem,7vw,2.4rem)}
.state p{color:var(--ink-soft)}
.spin{width:48px;height:48px;border-radius:12px;border:3px solid var(--ink);position:relative;animation:r 1.2s linear infinite}
.spin::after{content:"";position:absolute;inset:0;margin:auto;width:9px;height:9px;border-radius:50%;background:var(--cta)}
@keyframes r{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.ok{width:60px;height:60px;border-radius:50%;background:var(--green);display:grid;place-items:center}
.small-link{font-size:.92rem}
</style>
</head>
<body>
<header class="top"><div class="wrap"><a class="logo" href="/"><span class="dot"></span>LudoLab <small>Ebooks</small></a></div></header>
<main class="wrap">
  <section class="state card" id="box" aria-live="polite">
    <div class="spin" aria-hidden="true"></div>
    <h1>Confirmando tu pago…</h1>
    <p>Esto tarda unos segundos.</p>
  </section>
</main>
<footer class="site">
  <div class="wrap">
    <span>© LudoLab Ebooks</span>
    <nav><a href="/recuperar">¿No te llegó?</a><a href="/terminos">Términos</a><a href="/privacidad">Privacidad</a><a href="/contacto">Contacto</a><a href="/contacto#arrepentimiento">Botón de arrepentimiento</a></nav>
  </div>
</footer>
<script>
const box = document.getElementById("box");
const q = new URLSearchParams(location.search);
const paymentId = q.get("payment_id") || q.get("collection_id");
const ref = q.get("external_reference") || "";
const slug = (q.get("p") || ref.split("|")[0] || "dados").replace(/[^a-z0-9-]/g, "");
const v = (q.get("v") || q.get("l")) === "b" ? "b" : "a";
const RECUPERAR = '<a class="small-link" href="/recuperar">¿No te llegó o lo perdiste? Pedilo de nuevo acá</a>';
const esc = (s) => String(s || "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"})[c]);
function render(html) { box.innerHTML = html; }

// Purchase del navegador: una sola vez por pago (lo controla el servidor y además el navegador).
// Usa el mismo event_id que el servidor (mp_<pago>) para que Meta cuente una sola compra.
function trackPurchase(d) {
  const key = "fb_purchase_" + paymentId;
  try { if (localStorage.getItem(key)) return; } catch (e) {}
  if (!d.trackPixel) return;
  try {
    window.fbq && fbq("track", "Purchase", {value: Number(d.amount), currency: "ARS", content_ids: [d.slug, d.complemento].filter(Boolean), content_name: d.titulo,
      content_type: "product", num_items: d.complemento ? 2 : 1, variante: d.variante}, {eventID: d.eventId});
    localStorage.setItem(key, "1");
  } catch (e) {}
}

let fails = 0, started = Date.now();
async function check() {
  if (!paymentId) {
    render('<h1>No encontramos tu pago</h1><p>Si ya pagaste, en unos minutos te llega el link a tu mail.</p><a class="btn" href="/recuperar">Pedir mi ebook</a>');
    return;
  }
  try {
    const r = await fetch("/api/verify?payment_id=" + encodeURIComponent(paymentId) + "&ref=" + encodeURIComponent(ref));
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.status);
    if (d.status === "approved" && d.url) {
      trackPurchase(d);
      render('<div class="ok"><svg width="32" height="32" viewBox="0 0 20 20"><path d="M5 10.5l3 3 7-7" stroke="white" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>'
        + '<h1>¡Pago aprobado!</h1><p>Abriendo tu ebook…</p><a class="btn" href="' + d.url + '">📖 Abrir mi ebook</a>');
      setTimeout(() => location.replace(d.url), 700);
      return;
    }
    if (d.status === "rejected" || d.status === "cancelled") {
      render('<h1>El pago no se aprobó</h1><p>No se hizo ningún cobro. Podés intentar con otro medio de pago.</p><a class="btn" href="/' + slug + '/' + v + '#comprar">Intentar de nuevo</a>');
      return;
    }
    // pendiente, en proceso, etc.: seguimos consultando y redirigimos sola
    render('<div class="spin" aria-hidden="true"></div><h1>Tu pago se está acreditando</h1><p>Apenas se confirme te llega el ebook'
      + (d.email ? ' a <b>' + esc(d.email) + '</b>' : ' a tu mail') + '. Si dejás esta página abierta, se abre sola.</p>'
      + '<p class="small-link">Si pagaste en efectivo puede tardar hasta 2 días hábiles.</p>' + RECUPERAR);
    if (Date.now() - started < 30 * 60e3) setTimeout(check, 5000);
  } catch (e) {
    if (++fails < 6) return setTimeout(check, 2500);
    render('<h1>Recibimos tu pago</h1><p>Estamos terminando de confirmarlo. En unos minutos te llega el link a tu mail.</p>' + RECUPERAR);
  }
}
check();
</script>
</body>
</html>
