<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>¡Gracias! · LudoLab</title>
<!-- Meta Pixel -->
<script>
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
document,'script','https://connect.facebook.net/en_US/fbevents.js');
var ud={};try{ud=JSON.parse(localStorage.getItem('ll_lead')||'{}')}catch(e){}
fbq('init', '4240054562902602', ud);   // mail o WhatsApp que dejó en la landing

<noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=4240054562902602&ev=PageView&noscript=1"/></noscript>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Figtree:wght@400;600;800&display=swap">
<style>
:root{--paper:#FAF8F5;--ink:#18181B;--ink-soft:#5A5D7E;--cta:#DA3229;--cta-hover:#B8261E;--sun:#FFC23D;--green:#1F8E74;--card:#fff;--line:#E9E2D6;
  --f-display:"Fredoka","Arial Rounded MT Bold",system-ui,sans-serif;--f-body:"Figtree",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root{--paper:#17182B;--ink:#F4F1EA;--ink-soft:#B8B9D0;--cta:#F0584B;--cta-hover:#FF6E62;--green:#5CCDB0;--card:#21223A;--line:#2F3150;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:400 17px/1.6 var(--f-body);padding:24px 16px}
.box{max-width:520px;width:100%;background:var(--card);border:2px solid var(--ink);border-radius:24px;box-shadow:8px 8px 0 var(--ink);padding:32px 26px;display:flex;flex-direction:column;gap:16px;text-align:center;align-items:center}
h1{font:700 clamp(1.8rem,6vw,2.4rem)/1.05 var(--f-display);margin:0}
p{margin:0;color:var(--ink-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;border:0;border-radius:999px;background:var(--cta);color:#fff;font:800 1.15rem/1 var(--f-body);padding:1.05em 1.6em;text-decoration:none;box-shadow:0 4px 0 var(--cta-hover)}
.btn:hover{background:var(--cta-hover)}
.spin{width:44px;height:44px;border-radius:12px;border:3px solid var(--ink);animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.ok{width:56px;height:56px;border-radius:50%;background:var(--green);display:grid;place-items:center}
small{color:var(--ink-soft)}
a{color:inherit}
</style>
</head>
<body>
<main class="box" id="box">
  <div class="spin" aria-hidden="true"></div>
  <h1>Confirmando tu pago…</h1>
  <p>Esto tarda unos segundos.</p>
</main>
<script>
const SUPPORT_WA = ""; // ej "5491123456789"
const box = document.getElementById("box");
const q = new URLSearchParams(location.search);
const paymentId = q.get("payment_id") || q.get("collection_id");
const help = SUPPORT_WA ? ' Si necesitás ayuda escribinos al <a href="https://wa.me/' + SUPPORT_WA + '">+' + SUPPORT_WA + '</a>.' : "";

function render(html) { box.innerHTML = html; }

// Purchase solo cuando nuestro servidor confirmó con Mercado Pago que el pago está aprobado,
// y una sola vez por pago: lo controla el servidor (cualquier dispositivo) y además localStorage.
// El eventID mp_<payment_id> es el mismo que manda el servidor, así Meta los cuenta como una sola compra.
function trackPurchase(d) {
  const key = "fb_purchase_" + paymentId;
  try { if (localStorage.getItem(key)) return; } catch (e) {}
  if (d.trackPixel === false) return;   // el servidor dice que este pago ya se contó (otro dispositivo o recarga)
  const variante = d.variante || (String(d.landing || q.get("l") || "a").toUpperCase() === "B" ? "B" : "A");
  try {
    window.fbq && fbq("track", "Purchase",
      {value: Number(d.amount) || 11999, currency: "ARS", content_name: "100 juegos con dados", num_items: 1, variante: variante, cta_variant: d.cta},
      {eventID: "mp_" + paymentId});
    localStorage.setItem(key, "1");
  } catch (e) {}
}

async function check(attempt) {
  if (!paymentId) {
    render('<h1>No encontramos tu pago</h1><p>Si ya pagaste, revisá tu email o WhatsApp: el link te llega igual.' + help + '</p><a class="btn" href="/">Volver</a>');
    return;
  }
  try {
    const r = await fetch("/api/verify?payment_id=" + encodeURIComponent(paymentId));
    const d = await r.json();
    if (d.status === "approved" && d.downloadUrl) {
      trackPurchase(d);
      render('<div class="ok"><svg width="30" height="30" viewBox="0 0 20 20"><path d="M5 10.5l3 3 7-7" stroke="white" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>'
        + '<h1>¡Listo! Ya es tuyo</h1><p>Descargalo ahora. También te mandamos el link ' + (d.channel === "whatsapp" ? "por WhatsApp" : "a tu email") + '.</p>'
        + '<a class="btn" href="' + d.downloadUrl + '">Descargar el PDF</a><small>El link funciona durante 7 días.' + help + '</small>');
      return;
    }
    if (d.status === "pending" || d.status === "in_process" || d.status === "authorized") {
      render('<h1>Tu pago está pendiente</h1><p>Cuando Mercado Pago lo acredite (si pagaste en efectivo puede tardar hasta 2 días hábiles), te llega el ebook automáticamente.' + help + '</p>');
      return;
    }
    if (d.status === "rejected" || d.status === "cancelled") {
      render('<h1>El pago no se aprobó</h1><p>No se hizo ningún cobro. Podés intentar con otro medio de pago.</p><a class="btn" href="' + (q.get("l") === "b" ? "/b" : "/") + '#comprar">Intentar de nuevo</a>');
      return;
    }
    throw new Error("estado " + d.status);
  } catch (e) {
    if (attempt < 5) return setTimeout(() => check(attempt + 1), 2500);
    render('<h1>Recibimos tu pago</h1><p>Estamos terminando de confirmarlo. En unos minutos te llega el link al contacto que dejaste.' + help + '</p>');
  }
}
check(0);
</script>
</body>
</html>
